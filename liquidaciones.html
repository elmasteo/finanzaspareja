<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1120" />
  <title>Liquidaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="app ancha">
  <header class="topbar">
    <div>
      <h1>Liquidaciones</h1>
      <p class="sub">En qué se ha ido el dinero</p>
    </div>
    <button id="modoToggle" class="icon-btn" type="button" aria-label="Cambiar tema">🌙</button>
  </header>

  <section class="card filtros">
    <div class="fechas">
      <label class="campo">
        <span>Desde</span>
        <input type="month" id="desde" />
      </label>
      <label class="campo">
        <span>Hasta</span>
        <input type="month" id="hasta" />
      </label>
    </div>
    <div class="atajos">
      <button type="button" class="atajo" id="atajo-mes">Este mes</button>
      <button type="button" class="atajo" id="atajo-todo">Todo</button>
    </div>
  </section>

  <section class="balance total-card" data-estado="balanceado" style="--acento: var(--primary)">
    <p class="balance-label">Total liquidado</p>
    <p class="balance-monto" id="totalMonto">$ 0</p>
    <p class="balance-texto" id="totalTexto"></p>
  </section>

  <section class="card" id="seccionGrafico">
    <div class="grafico-wrap">
      <canvas id="graficoTorta" aria-label="Gastos por categoría" role="img"></canvas>
    </div>
    <div class="ranking" id="ranking"></div>
  </section>

  <section class="card detalle-categoria" id="detalleCategoria" hidden></section>
</main>

<nav class="dock" aria-label="Navegación">
  <button class="btn btn-sec" id="btnVolver" type="button">← Volver</button>
</nav>

<script>
const COP = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0, maximumFractionDigits: 0 });

const COLORES = ['#7a88ff', '#2ee6b6', '#ff6aa8', '#ffb84d', '#4aa8ff', '#b07bff', '#ff7a59', '#5ad1e6', '#9be564', '#f2d14a', '#9aa2c6'];

let liquidaciones = [];
let chart = null;
let categoriaActiva = null;

function esc(texto) {
  return String(texto ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const cssVar = nombre => getComputedStyle(document.documentElement).getPropertyValue(nombre).trim();

async function cargarLiquidaciones() {
  try {
    const res = await fetch("/liquidaciones.json");
    const data = await res.json();
    liquidaciones = Array.isArray(data) ? data : [];
  } catch {
    liquidaciones = [];
  }
  render();
}

// Gastos dentro del rango de meses seleccionado
function gastosFiltrados() {
  const desde = document.getElementById("desde").value;
  const hasta = document.getElementById("hasta").value;
  return liquidaciones
    .flatMap(lote => lote.gastos || [])
    .filter(g => (!desde || g.fecha >= desde + '-01') && (!hasta || g.fecha <= hasta + '-31'));
}

function agruparPorCategoria(gastos) {
  const categorias = {};
  gastos.forEach(g => {
    const cat = g.categoria || "Otros";
    categorias[cat] = (categorias[cat] || 0) + g.monto;
  });
  return Object.entries(categorias).sort((a, b) => b[1] - a[1]);
}

function render() {
  const gastos = gastosFiltrados();
  const grupos = agruparPorCategoria(gastos);
  const total = grupos.reduce((acc, [, monto]) => acc + monto, 0);

  document.getElementById("totalMonto").textContent = COP.format(total);
  document.getElementById("totalTexto").textContent =
    gastos.length ? `${gastos.length} ${gastos.length === 1 ? "gasto" : "gastos"} en ${grupos.length} ${grupos.length === 1 ? "categoría" : "categorías"}` : "";

  if (categoriaActiva && !grupos.some(([cat]) => cat === categoriaActiva)) categoriaActiva = null;

  renderGrafico(grupos);
  renderRanking(grupos, total);
  renderDetalle(gastos);
}

function renderGrafico(grupos) {
  const canvas = document.getElementById("graficoTorta");
  if (chart) chart.destroy();

  canvas.parentElement.style.display = grupos.length ? "block" : "none";
  if (!grupos.length) return;

  Chart.defaults.font.family = "Manrope, system-ui, sans-serif";
  Chart.defaults.color = cssVar("--muted");

  chart = new Chart(canvas.getContext("2d"), {
    type: 'doughnut',
    data: {
      labels: grupos.map(([cat]) => cat),
      datasets: [{
        data: grupos.map(([, monto]) => monto),
        backgroundColor: grupos.map((_, i) => COLORES[i % COLORES.length]),
        borderColor: cssVar("--surface"),
        borderWidth: 3,
        hoverOffset: 8
      }]
    },
    options: {
      responsive: true,
      cutout: '58%',
      onClick: (evt, elements) => {
        if (!elements.length) return;
        seleccionarCategoria(grupos[elements[0].index][0]);
      },
      plugins: {
        legend: { display: false }, // el ranking de abajo hace de leyenda
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.label}: ${COP.format(ctx.parsed || 0)}`
          }
        }
      }
    }
  });
}

function renderRanking(grupos, total) {
  const cont = document.getElementById("ranking");

  if (!grupos.length) {
    cont.innerHTML = `<div class="vacio"><strong>Sin liquidaciones en este periodo</strong>Prueba con otro rango de meses o toca “Todo”.</div>`;
    return;
  }

  cont.innerHTML = grupos.map(([cat, monto], i) => {
    const pct = total ? (monto / total) * 100 : 0;
    const color = COLORES[i % COLORES.length];
    return `
      <button type="button" class="ranking-item" data-cat="${esc(cat)}" aria-pressed="${cat === categoriaActiva}">
        <span class="punto" style="background:${color}"></span>
        <span class="ranking-nombre">${esc(cat)}</span>
        <span class="ranking-monto">${COP.format(monto)}</span>
        <span class="ranking-pct">${pct.toFixed(1)}% del total</span>
        <span class="barra"><i style="width:${pct}%; background:${color}"></i></span>
      </button>`;
  }).join("");

  cont.querySelectorAll(".ranking-item").forEach(btn => {
    btn.addEventListener("click", () => seleccionarCategoria(btn.dataset.cat));
  });
}

function seleccionarCategoria(cat) {
  categoriaActiva = categoriaActiva === cat ? null : cat;
  render();
  if (categoriaActiva) {
    document.getElementById("detalleCategoria").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function renderDetalle(gastos) {
  const detalle = document.getElementById("detalleCategoria");

  if (!categoriaActiva) {
    detalle.hidden = true;
    return;
  }

  const items = gastos.filter(g => (g.categoria || "Otros") === categoriaActiva);
  const subtotal = items.reduce((acc, g) => acc + g.monto, 0);

  detalle.innerHTML = `
    <h2 class="card-title">${esc(categoriaActiva)} · ${COP.format(subtotal)}</h2>
    <ul class="detalle-lista">
      ${items.map(g => `
        <li data-autor="${esc(String(g.autor).toLowerCase())}">
          <div>
            <strong>${esc(g.descripcion)}</strong>
            <small>${esc(g.fecha)} · ${esc(g.autor)}</small>
          </div>
          <span class="monto">${COP.format(g.monto)}</span>
        </li>`).join("")}
    </ul>`;
  detalle.hidden = false;
}

/* ---------------- Filtros ---------------- */

document.getElementById("desde").addEventListener("change", render);
document.getElementById("hasta").addEventListener("change", render);

document.getElementById("atajo-mes").addEventListener("click", () => {
  const hoy = new Date();
  const mes = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`;
  document.getElementById("desde").value = mes;
  document.getElementById("hasta").value = mes;
  render();
});

document.getElementById("atajo-todo").addEventListener("click", () => {
  document.getElementById("desde").value = "";
  document.getElementById("hasta").value = "";
  render();
});

document.getElementById("btnVolver").addEventListener("click", () => {
  if (window.history.length > 1) window.history.back();
  else window.location.href = "index.html";
});

// Al cambiar de tema se redibuja el gráfico con los colores nuevos
window.addEventListener("tema-cambiado", render);

cargarLiquidaciones();
</script>
</body>
</html>
