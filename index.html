<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finanzas en Pareja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>

<header>
  <h1>Finanzas en Pareja - Adriana - Santiago</h1>
</header>

<button id="modoToggle">🌙 Modo Oscuro</button>

<section class="card">
  <strong>Saldo total:</strong>
  <p id="saldoTexto">Cargando...</p>
</section>

<section class="card gasto-form">
  <label>Pagado por:</label>
  <select id="autor">
    <option value="Santiago">Santiago</option>
    <option value="Adriana">Adriana</option>
  </select>
  <input type="text" id="descripcion" placeholder="Descripción del gasto" />
  <input type="number" id="monto" placeholder="Monto" step="0.01" />
  <select id="tipo-division">
    <option value="total">Se debe el total</option>
    <option value="mitad">Mitad y mitad</option>
    <option value="porcentaje">Porcentaje</option>
  </select>
  <div class="row" id="porcentaje-fields" style="display: none">
    <div><input type="number" id="porcentaje-Santiago" placeholder="% Santiago" max="100" /></div>
    <div><input type="number" id="porcentaje-Adriana" placeholder="% Adriana" max="100" /></div>
  </div>
  <button onclick="agregarGasto()">Agregar gasto</button>
</section>

<section id="gastos-lista"></section>

<button id="btn-liquidar-todo" onclick="liquidarDeudas()">💰</button>
<a href="liquidaciones.html">
  <button>📊 Ver Liquidaciones</button>
</a>

<script>
async function init() {
  const clave = await new Promise(resolve => {
  const overlay = document.createElement("div");
  overlay.style.position = "fixed";
  overlay.style.top = 0;
  overlay.style.left = 0;
  overlay.style.width = "100vw";
  overlay.style.height = "100vh";
  overlay.style.background = "rgba(0,0,0,0.8)";
  overlay.style.display = "flex";
  overlay.style.flexDirection = "column";
  overlay.style.justifyContent = "center";
  overlay.style.alignItems = "center";
  overlay.style.zIndex = 9999;

  const input = document.createElement("input");
  input.type = "password";
  input.placeholder = "🔒 Ingresa tu clave";
  input.style.padding = "10px";
  input.style.fontSize = "16px";
  input.style.borderRadius = "5px";
  input.style.border = "1px solid #ccc";
  input.style.marginBottom = "10px";

  const btn = document.createElement("button");
  btn.textContent = "Acceder";
  btn.style.padding = "10px 20px";
  btn.style.fontSize = "16px";
  btn.style.border = "none";
  btn.style.borderRadius = "5px";
  btn.style.cursor = "pointer";

  btn.onclick = () => {
    const val = input.value;
    document.body.removeChild(overlay);
    resolve(val);
  };

  overlay.appendChild(input);
  overlay.appendChild(btn);
  document.body.appendChild(overlay);
});


  const res = await fetch('/.netlify/functions/validarClave', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ clave })
  });

  const { autorizado } = await res.json();

  if (!autorizado) {
    alert("Clave incorrecta. Acceso denegado.");
    document.body.innerHTML = "<h2 style='text-align:center; margin-top:20%'>🚫 Acceso no autorizado</h2>";
    return;
  }

  // Si la clave es correcta, continuar:
  const resGastos = await fetch('/gastos.json');
  const dataGastos = await resGastos.json();
  gastos = dataGastos.gastos || [];

  try {
    const resLiq = await fetch('/liquidaciones.json');
    const dataLiq = await resLiq.json();
    liquidaciones = Array.isArray(dataLiq) ? dataLiq : [];
  } catch {
    liquidaciones = [];
  }

  renderGastos();
}

// Llama init al cargar
init();

  document.getElementById("tipo-division").addEventListener("change", e => {
    document.getElementById("porcentaje-fields").style.display = e.target.value === "porcentaje" ? "flex" : "none";
  });

 async function guardarGastos() {
   await fetch('/.netlify/functions/guardarGasto', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(gastos)
    });
  }

const formatoCOP = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0, maximumFractionDigits: 0 });
// Redefinir la función que convierte a formato peso colombiano
function formatearCOP(valor) {
  return formatoCOP.format(valor);
}

  function agregarGasto() {

    const autor = document.getElementById("autor").value;
    const descripcion = document.getElementById("descripcion").value.trim();
    const monto = parseFloat(document.getElementById("monto").value);
    const tipo = document.getElementById("tipo-division").value;
    const fecha = new Date().toISOString().split("T")[0]; // formato YYYY-MM-DD
    const categoria = categorizarDescripcion(descripcion);

    if (!descripcion || isNaN(monto) || monto <= 0) return alert("Complete todos los campos correctamente");

    let porcentajeSantiago = 50, porcentajeAdriana = 50;
    if (tipo === "porcentaje") {
      porcentajeSantiago = parseInt(document.getElementById("porcentaje-Santiago").value) || 0;
      porcentajeAdriana = parseInt(document.getElementById("porcentaje-Adriana").value) || 0;
      if (porcentajeSantiago + porcentajeAdriana !== 100) return alert("Los porcentajes deben sumar 100%");
    }

    const nuevoGasto = {
      id: Date.now(),
      autor,
      descripcion,
      monto,
      tipo,
      porcentajeSantiago,
      porcentajeAdriana,
      fecha,
      categoria
    };
    gastos.push(nuevoGasto);
    guardarGastoIndividual(nuevoGasto);
    const mensaje = `🔔 Nuevo gasto agregado:\n\nDescripción: "${descripcion}"\nMonto: ${monto}\nAgregado por ${autor}\nFecha: ${fecha}\nDivisión: ${getDivisionDetalle(nuevoGasto)}\n\n${obtenerTextoDeudaActual()}\n\n🔗 https://finanzaspareja.netlify.app`;

    enviarWhatsapp(mensaje);

    renderGastos();
  }

  function categorizarDescripcion(desc) {
 const mapa = {
  Comida: [
    "almuerzo", "cena", "comida", "hamburguesa", "restaurante", "taco", "desayuno", "pizza", "pollo",
    "carne", "empanada", "antojito", "sándwich", "perro", "comida rápida", "arepa", "antojitos"
  ],
  Transporte: [
    "uber", "taxi", "bus", "pasaje", "metro", "transporte", "parqueadero", "gasolina", "peaje", "viaje", "conductor"
  ],
  Servicios: [
    "agua", "luz", "gas", "internet", "teléfono", "servicio", "energía", "recibo", "factura", "tv", "streaming"
  ],
  Hogar: [
    "arriendo", "mercado", "supermercado", "limpieza", "aseo", "hogar", "d1", "exito", "almacén", "fruver",
    "queso", "compra casa", "detergente"
  ],
  Entretenimiento: [
    "cine", "netflix", "spotify", "juego", "fiesta", "licor", "cerveza", "rumba", "bar", "concierto", "play", "ocio", "discoteca"
  ],
  Salud: [
    "medicina", "doctor", "salud", "farmacia", "dentista", "consulta", "cita médica", "oído", "tratamiento", "clínica"
  ],
  Vestuario: [
    "ropa", "pantalón", "chaqueta", "camisa", "zapato", "tenis", "blusa", "jean", "vestido", "ropa interior", "copa"
  ],
  Regalos: [
    "regalo", "cumpleaños", "detalles", "obsequio", "bolsa regalo", "perfume", "sorpresa"
  ],
  Tecnologia: [
    "celular", "computador", "tablet", "audífono", "teclado", "mouse", "pantalla", "tv", "electrónico"
  ],
  Mascotas: [
    "mascota", "perro", "gato", "comida perro", "comida gato", "veterinario", "collar"
  ],
  Otros: []
};


  const descLower = desc.toLowerCase();
  for (const [categoria, palabras] of Object.entries(mapa)) {
    if (palabras.some(p => descLower.includes(p))) return categoria;
  }
  return "Otros";
}

function renderGastos() {
  const cont = document.getElementById("gastos-lista");
  cont.innerHTML = "";
  let deuda = 0;

  for (let gasto of gastos) {
    const div = document.createElement("div");
    div.className = "gasto-item";
    div.setAttribute("data-id", gasto.id);

    const editable = gasto.editando === true;

    div.innerHTML = `
      <div class="acciones">
        ${editable ? `
          <button class="btn-guardar" onclick="guardarEdicion(${gasto.id})">✅</button>
          <button class="btn-cancelar" onclick="cancelarEdicion(${gasto.id})">❌</button>
        ` : `
          <button class="btn-editar" onclick="iniciarEdicion(${gasto.id})">✏️</button>
          <button class="btn-liquidar" onclick="liquidarGasto(${gasto.id})">💰</button>
          <button class="btn-eliminar" onclick="eliminarGasto(${gasto.id})">🗑️</button>
        `}
      </div>
      
      <div class="contenido">
        ${editable ? `
          <input type="text" class="input-desc" value="${gasto.descripcion}">
          <input type="number" class="input-monto" step="0.01" value="${formatearCOP(gasto.monto)}">
        ` : `
          <div><strong>${gasto.descripcion}</strong></div>
          <div>${formatearCOP(gasto.monto)}</div>
        `}
      </div>
      <div class="detalle">${getDetalleGasto(gasto)}</div>
      <div class="meta">${gasto.fecha}</div>
    `;

    cont.appendChild(div);

    // Calcular deuda
    if (gasto.tipo === "total") {
      deuda += gasto.autor === "Santiago" ? gasto.monto : -gasto.monto;
    } else if (gasto.tipo === "mitad") {
      const mitad = gasto.monto / 2;
      deuda += gasto.autor === "Santiago" ? mitad : -mitad;
    } else {
      const s = (gasto.porcentajeSantiago / 100) * gasto.monto;
      const a = (gasto.porcentajeAdriana / 100) * gasto.monto;
      deuda += gasto.autor === "Santiago" ? a : -s;
    }
  }

  let texto = "Saldo balanceado";
  if (deuda > 0.01) texto = `Adriana debe ${formatearCOP(Math.abs(deuda))} a Santiago`;
  else if (deuda < -0.01) texto = `Santiago debe ${formatearCOP(Math.abs(deuda))} a Adriana`;
  document.getElementById("saldoTexto").textContent = texto;
}


function editarCampo(id, campo, valor) {
  const gasto = gastos.find(g => g.id === id);
  if (!gasto) return;

  if (campo === "descripcion") {
    gasto.descripcion = valor.trim();
    gasto.categoria = categorizarDescripcion(valor);
  } else if (campo === "monto") {
    const nuevoMonto = parseFloat(valor);
    if (isNaN(nuevoMonto) || nuevoMonto <= 0) {
      alert("Monto inválido");
      renderGastos();
      return;
    }
    gasto.monto = nuevoMonto;
  }

  guardarGastos();
  renderGastos();

  const mensaje = `✏️ Gasto actualizado:\nDescripción: "${gasto.descripcion}"\nMonto: ${formatearCOP(gasto.monto)}\nAgregado por ${gasto.autor}\nFecha: ${gasto.fecha}\nDivisión: ${getDivisionDetalle(gasto)}\n\n${obtenerTextoDeudaActual()}\n\n🔗 https://finanzaspareja.netlify.app`;
  enviarWhatsapp(mensaje);
}



function editarGasto(id) {
  const gasto = gastos.find(g => g.id === id);
  if (!gasto) return alert("Gasto no encontrado");

  const nuevaDescripcion = prompt("Nueva descripción:", gasto.descripcion);
  if (!nuevaDescripcion) return;

  const nuevoMonto = parseFloat(prompt("Nuevo monto:", gasto.monto));
  if (isNaN(nuevoMonto) || nuevoMonto <= 0) return alert("Monto inválido");

  const nuevaDivision = prompt("Tipo de división (total/mitad/porcentaje):", gasto.tipo);
  if (!["total", "mitad", "porcentaje"].includes(nuevaDivision)) return alert("Tipo inválido");

  let porcentajeSantiago = 50, porcentajeAdriana = 50;

  if (nuevaDivision === "porcentaje") {
    porcentajeSantiago = parseInt(prompt("Porcentaje Santiago:", gasto.porcentajeSantiago)) || 0;
    porcentajeAdriana = parseInt(prompt("Porcentaje Adriana:", gasto.porcentajeAdriana)) || 0;
    if (porcentajeSantiago + porcentajeAdriana !== 100) return alert("Los porcentajes deben sumar 100%");
  }

  gasto.descripcion = nuevaDescripcion;
  gasto.monto = nuevoMonto;
  gasto.tipo = nuevaDivision;
  gasto.porcentajeSantiago = porcentajeSantiago;
  gasto.porcentajeAdriana = porcentajeAdriana;

  guardarGastos();
  renderGastos();

  const mensaje = `🔄 Se ha actualizado un gasto:\n\nDescripción: "${gasto.descripcion}"\nMonto: ${formatearCOP(gasto.monto)}\nAgregado por ${gasto.autor}\nFecha: ${gasto.fecha}\nDivisión: ${getDivisionDetalle(gasto)}\n\n${obtenerTextoDeudaActual()}\n\n🔗 https://finanzaspareja.netlify.app`;
  enviarWhatsapp(mensaje);
}

async function eliminarGasto(id) {
  if (!confirm("¿Eliminar este gasto? No se guardará en liquidaciones.")) return;

  const gasto = gastos.find(g => g.id === id);
  if (!gasto) return alert("Gasto no encontrado");

  gastos = gastos.filter(g => g.id !== id);
  await guardarGastos();
  renderGastos();

  const mensaje = `❌ Se eliminó un gasto:\n\nDescripción: "${gasto.descripcion}"\nMonto: ${formatearCOP(gasto.monto)}\nAgregado por ${gasto.autor}\nFecha: ${gasto.fecha}`;
  enviarWhatsapp(mensaje);
}


function obtenerTextoDeudaActual() {
  let deuda = 0;
  for (let gasto of gastos) {
    if (gasto.tipo === "total") {
      deuda += gasto.autor === "Santiago" ? gasto.monto : -gasto.monto;
    } else if (gasto.tipo === "mitad") {
      const mitad = gasto.monto / 2;
      deuda += gasto.autor === "Santiago" ? mitad : -mitad;
    } else if (gasto.tipo === "porcentaje") {
      const montoSantiago = (gasto.porcentajeSantiago / 100) * gasto.monto;
      const montoAdriana = (gasto.porcentajeAdriana / 100) * gasto.monto;
      const deberAdriana = gasto.autor === "Santiago" ? montoAdriana : -montoSantiago;
      deuda += deberAdriana;
    }
  }

  if (Math.abs(deuda) < 0.01) return "Saldo balanceado";
  if (deuda > 0.01) return `Adriana debe ${formatearCOP(deuda)} a Santiago`;
  return `Santiago debe ${formatearCOP(Math.abs(deuda))} a Adriana`;
}


async function liquidarGasto(id) {
  if (!confirm("¿Seguro que deseas liquidar este gasto?")) return;

  const gasto = gastos.find(g => g.id === id);
  if (!gasto) return alert("Gasto no encontrado");

  // Fecha actual para la liquidación
  const fechaLiquidacion = new Date().toISOString().split("T")[0];

  // Agregar gasto a liquidaciones
  liquidaciones.push({
    fecha: fechaLiquidacion,
    gastos: [gasto]
  });

  // Guardar liquidaciones
  await fetch('/.netlify/functions/guardarLiquidaciones', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(liquidaciones)
  });

  // Enviar notificación WhatsApp
  const mensaje = `🔔 Se ha liquidado un gasto:\n\nDescripción: "${gasto.descripcion}"\nMonto: ${formatearCOP(gasto.monto)}\nAgregado por ${gasto.autor}\nFecha: ${gasto.fecha}\n\nRevísalo aquí: https://finanzaspareja.netlify.app`;
  enviarWhatsapp(mensaje);

  // Eliminar gasto de lista y guardar
  gastos = gastos.filter(g => g.id !== id);
  await guardarGastos();

  renderGastos();
}

async function liquidarDeudas() {
  if (!confirm("¿Seguro que deseas eliminar todos los gastos?")) return;

  const fechaLiquidacion = new Date().toISOString().split("T")[0];
  const lote = {
    fecha: fechaLiquidacion,
    gastos: [...gastos]
  };
  liquidaciones.push(lote);

  await fetch('/.netlify/functions/guardarLiquidaciones', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(liquidaciones)
  });

 const detalle = gastos.map(g => `- ${g.descripcion} (${g.monto})`).join("\n");
  enviarWhatsapp(`🔔 Se ha generado una liquidación:\n\n${detalle}`);


  gastos = [];
  guardarGastos();
  renderGastos();
}

async function verLiquidaciones() {
  const res = await fetch("/liquidaciones.json");
  const data = await res.json();
  liquidaciones = data;

  const mes = prompt("Filtrar por mes (formato YYYY-MM, ejemplo 2025-06):");

  const resultados = liquidaciones.flatMap(lote => {
    return lote.gastos
      .filter(g => g.fecha.startsWith(mes))
      .map(g => `${g.fecha} - ${g.descripcion} (${g.monto}) [${g.categoria}]`);
  });

  alert("📅 Resultados:\n\n" + resultados.join("\n"));
}


 function guardarGastoIndividual(gasto) {
  fetch('/.netlify/functions/guardarGasto', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(gasto)
  }).then(r => r.json())
    .then(data => {
      if (!data.success) console.error("Error guardando gasto:", data.error);
    });
}

function getDivisionDetalle(gasto) {
  if (gasto.tipo === "mitad") {
    const mitad = gasto.monto / 2;
    return `Mitad y mitad – ${formatearCOP(mitad)} para cada uno`;
  } else if (gasto.tipo === "total") {
    if (gasto.autor === "Santiago") {
      return `Santiago pagó el total – Adriana debe ${formatearCOP(gasto.monto)}`;
    } else {
      return `Adriana pagó el total – Santiago debe ${formatearCOP(gasto.monto)}`;
    }
  } else {
    const s = (gasto.porcentajeSantiago / 100) * gasto.monto;
    const a = (gasto.porcentajeAdriana / 100) * gasto.monto;
    return `Porcentaje – 
    Santiago: ${formatearCOP(s)} - ${gasto.porcentajeSantiago}% 
    Adriana: ${formatearCOP(a)} - ${gasto.porcentajeAdriana}%`;
  }
}

function iniciarEdicion(id) {
  const gasto = gastos.find(g => g.id === id);
  if (!gasto) return;
  gasto.editando = true;
  renderGastos();
}

function cancelarEdicion(id) {
  const gasto = gastos.find(g => g.id === id);
  if (!gasto) return;
  delete gasto.editando;
  renderGastos();
}

function guardarEdicion(id) {
  const gasto = gastos.find(g => g.id === id);
  if (!gasto) return;

  const div = document.querySelector(`[data-id='${id}']`);
  const nuevaDesc = div.querySelector(".input-desc").value.trim();
  const nuevoMonto = parseFloat(div.querySelector(".input-monto").value);

  if (!nuevaDesc || isNaN(nuevoMonto) || nuevoMonto <= 0) {
    alert("Campos inválidos");
    return;
  }

  gasto.descripcion = nuevaDesc;
  gasto.monto = nuevoMonto;
  gasto.categoria = categorizarDescripcion(nuevaDesc);
  delete gasto.editando;

  guardarGastos();
  renderGastos();

  const mensaje = `✏️ Gasto actualizado:\nDescripción: "${gasto.descripcion}"\nMonto: ${formatearCOP(gasto.monto)}\nAgregado por ${gasto.autor}\nFecha: ${gasto.fecha}\nDivisión: ${getDivisionDetalle(gasto)}\n\n${obtenerTextoDeudaActual()}\n\n🔗 https://finanzaspareja.netlify.app`;
  enviarWhatsapp(mensaje);
}

function getDetalleGasto(gasto) {

  if (gasto.tipo === "total") {
    return esSantiago
      ? `Adriana debe a Santiago: ${formatearCOP(gasto.monto)} (100%)`
      : `Santiago debe a Adriana: ${formatearCOP(gasto.monto)} (100%)`;
  }

  if (gasto.tipo === "mitad") {
    const mitad = gasto.monto / 2;
    return `${gasto.autor} pagó ${formatearCOP(gasto.monto)}, ${otro} debe ${formatearCOP(mitad)} (50%)`;
  }

const s = (gasto.porcentajeSantiago / 100) * gasto.monto;
const a = (gasto.porcentajeAdriana / 100) * gasto.monto;

const esSantiago = gasto.autor === "Santiago";

const pagoAutor = esSantiago ? s : a;
const porcentajeAutor = esSantiago ? gasto.porcentajeSantiago : gasto.porcentajeAdriana;

const deudaOtro = esSantiago ? a : s;
const porcentajeOtro = esSantiago ? gasto.porcentajeAdriana : gasto.porcentajeSantiago;

const otro = esSantiago ? "Adriana" : "Santiago";

return `${gasto.autor} pagó ${formatearCOP(gasto.monto)} (${porcentajeAutor}%)
${otro} debe ${formatearCOP(deudaOtro)} (${porcentajeOtro}%)`;
}



function enviarWhatsapp(mensaje) {
  const numeros = ["573219779439", "573157862008"];
  numeros.forEach(num => {
    fetch("/.netlify/functions/enviarWhatsapp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ number: num, text: mensaje })
    });
  });
}

document.body.classList.add("dark");

const toggle = document.getElementById("modoToggle");
toggle.textContent = document.body.classList.contains("dark") ? "☀️ Modo Claro" : "🌙 Modo Oscuro";

toggle.addEventListener("click", () => {
  document.body.classList.toggle("dark");
  toggle.textContent = document.body.classList.contains("dark") ? "☀️ Modo Claro" : "🌙 Modo Oscuro";
});

  
</script>
</body>
</html>
